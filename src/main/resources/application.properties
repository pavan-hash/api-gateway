spring.application.name=api-gateway-v3

server.port=${PORT:8100}

# Eureka: read the registry, don't register the gateway itself
eureka.client.service-url.defaultZone=${EUREKA_URL}
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=true

# Route /SERVICE-NAME/** to the matching Eureka service
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true

# CORS (the only place it is handled)
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=${FRONTEND_URL}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true

# Longer waits, because free services wake up slowly
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=10000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=90s


jwt.secret=${SECRET}